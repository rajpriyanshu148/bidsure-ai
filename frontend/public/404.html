<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>BidSure AI - Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License - https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var repo = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var route = l.pathname.slice(repo.length) + (l.search || '') + (l.hash || '');
      l.replace(repo + '/#' + route);
    </script>
  </head>
  <body>
    Redirecting to BidSure AI...
  </body>
</html>
